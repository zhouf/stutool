<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>学生身份证明开具</title>
<!-- 页面描述 -->
<meta name="description" content="用于快速生成学生在校身份证明，支持手机、电脑直接生成PDF文件">
<meta name="author" content="zhouf_t@swufe.edu.cn">
<meta name="copyright" content="© 2026 zhouf_t@swufe.edu.cn">
<meta name="generator" content="Hand-coded">
<style>
*{box-sizing: border-box;margin:0;padding:0;}
body{padding:15px;background:#f5f5f5;font-size:16px;}
.form-box{background:#fff;padding:20px;border-radius:8px;width:900px;max-width:100%;margin:0 auto 20px;}
.item{margin:12px 0;}
label{display:block;margin-bottom:6px;font-weight:bold;}
input[type="text"],input[type="date"],input[type="file"]{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;}
#imgPreview{max-width:140px;margin:8px 0;border:1px solid #eee;display:none;}
.btn{display:block;width:100%;padding:12px;background:#2b7bdd;color:#fff;border:none;border-radius:6px;margin-top:10px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer;}
.btn:disabled{background:#9bb9dd;cursor:default;}
.btn-secondary{background:#6c757d;}
.btn-secondary:hover{background:#565e64;}
#resultBox{background:#fff;padding:20px;border-radius:8px;width:900px;max-width:100%;margin:0 auto 20px;}
#resultBox h4{margin-bottom:8px;}
#resultBox .tip{font-size:13px;color:#888;margin-top:12px;line-height:1.6;}
#pdfFileName{word-break:break-all;font-size:14px;color:#555;margin-bottom:10px;}
/* 性别 / 证明类型 单行布局 */
.gender-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
</style>
</head>
<body>
<!-- 填写表单区域 -->
<div class="form-box">
    <h3>填写学生信息</h3>
    <div class="item">
        <label>证明类型：</label>
        <div class="gender-row">
            <input type="radio" name="prooftype" id="proofstu" value="exam" checked>
            <label for="proofstu">在校学生身份证明</label>
            <input type="radio" name="prooftype" id="proofcet" value="cet">
            <label for="proofcet">大学英语四六级身份证明</label>
        </div>
    </div>
    <div class="item">
        <label>姓名</label>
        <input type="text" id="name" placeholder="请输入姓名" required>
    </div>
    <div class="item">
        <label>性别：</label>
        <div class="gender-row">
            <input type="radio" name="sex" id="sexMale" value="男" checked>
            <label for="sexMale">男</label>
            <input type="radio" name="sex" id="sexFemale" value="女">
            <label for="sexFemale">女</label>
        </div>
    </div>
    <div class="item">
        <label>民族：</label>
        <input type="text" id="nation" required>
    </div>
    <div class="item">
        <label>身份证号</label>
        <input type="text" id="idcard" placeholder="请输入身份证号码" required>
    </div>
    <div class="item">
        <label>出生日期</label>
        <input type="date" id="birth" required>
    </div>
    <div class="item">
        <label>学号</label>
        <input type="text" id="stuId" placeholder="请输入学号" required>
    </div>
    <div class="item">
        <label>年级：</label>
        <input type="text" id="grade" placeholder="请输入年级" required>
    </div>
    <div class="item">
        <label>专业：</label>
        <input type="text" id="major" placeholder="请输入专业名称" required>
    </div>
    <div class="item">
        <label>学院</label>
        <input type="text" id="dept" placeholder="请填写学院名称" required>
    </div>
    <div class="item">
        <label>上传本人证件照</label>
        <input type="file" id="fileImg" accept="image/*">
        <img id="imgPreview">
    </div>
    <button class="btn" id="createBtn">生成 PDF 文件（手机 / 电脑通用）</button>
</div>

<!-- 生成结果区域 -->
<div class="result-box" id="resultBox" style="display:none;">
    <h4>PDF 已生成</h4>
    <div id="pdfFileName"></div>
    <a class="btn" id="downloadLink" download>下载 PDF 文件</a>
    <a class="btn btn-secondary" id="openLink" target="_blank" rel="noopener">打开 / 预览 PDF</a>
    <p class="tip">手机上如果没有自动下载，请点"打开 / 预览 PDF"，在预览页面长按文件选择"存储到文件/下载"。本工具不会上传您的任何信息，全部在本机完成。</p>
</div>

<script>
let imgBase64 = '';
const fileInput = document.getElementById('fileImg');
const previewImg = document.getElementById('imgPreview');

// 选择照片预览（本地处理，不上传）
fileInput.onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = ev=>{
        imgBase64 = ev.target.result;
        previewImg.src = imgBase64;
        previewImg.style.display = 'block';
    }
}

// 获取单选框选中值
function getRadioVal(name) {
  const radios = document.querySelectorAll(`input[name="${name}"]`);
  for (let r of radios) {
    if (r.checked) return r.value;
  }
  return '';
}

// 从身份证号提取出生日期并填充到指定控件
function extractBirthDateInto(idcard,date_obj) {
    if (!idcard || idcard.length < 14) return '';
    // 身份证第7-14位为出生日期（YYYYMMDD）
    var birthStr = idcard.substring(6, 14);
    var year = birthStr.substring(0, 4);
    var month = birthStr.substring(4, 6);
    var day = birthStr.substring(6, 8);
    date_obj.value = year + '-' + month + '-' + day;
}
function formatDateFromInput(dateStr) {
    if (!dateStr) return '';
    var parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    return parts[0] + '年' + parts[1] + '月' + parts[2] + '日';
}
function formatToday() {
    var date = new Date();
    var year = date.getFullYear();
    var month = String(date.getMonth() + 1).padStart(2, '0');
    var day = String(date.getDate()).padStart(2, '0');
    return year + '年' + month + '月' + day + '日';
}

document.getElementById('idcard').addEventListener('input', function() {
    var idcard = this.value.replace(/\s/g, ''); // 去除空格
    if (idcard.length >= 14) {
        extractBirthDateInto(idcard, document.getElementById('birth'));
    }
});

// 读取并校验表单数据
function collectData() {
    const data = {
        name: document.getElementById('name').value.trim(),
        sex: getRadioVal('sex'),
        nation: document.getElementById('nation').value.trim(),
        idcard: document.getElementById('idcard').value.trim(),
        birth: formatDateFromInput(document.getElementById('birth').value.trim()),
        stuid: document.getElementById('stuId').value.trim(),
        grade: document.getElementById('grade').value.trim(),
        major: document.getElementById('major').value.trim(),
        dept: document.getElementById('dept').value.trim(),
        isCet: getRadioVal('prooftype') === 'cet',
        date: formatToday()
    };
    for (const key of ['name','nation','idcard','stuid','grade','major','dept']) {
        if (!data[key]) {
            alert('请完整填写所有信息');
            return null;
        }
    }
    if (!data.birth) {
        alert('请选择出生日期');
        return null;
    }
    return data;
}

/* =========================================================
   以下为纯前端生成 PDF 的实现（不依赖任何外部库，手机可用）
   思路：用 Canvas 按 A4 版式绘制证明 -> 转为 JPEG
        -> 手工封装成标准 PDF（内嵌一张 JPEG 图片）
   ========================================================= */

// ★★★ 字体配置：想改生成 PDF 的字体，只改下面两个常量即可 ★★★
// 写法：引号里填字体名，用英文逗号分隔多个候选，浏览器会依次选用设备已安装的字体。
// 注意：字体必须是手机上/电脑上实际安装过的才会生效，否则自动回退到系统字体。
// 常用候选：宋体/SimSun、仿宋/FangSong、黑体/SimHei、楷体/KaiTi、serif、sans-serif
const FONT_TITLE = '"方正小标宋简体","华文中宋","SimSun","宋体",serif'; // 标题字体
const FONT_BODY  = '"仿宋","FangSong","FZFS","SimSun","宋体",serif';     // 正文/落款/下划线填写字体

// 在画布上绘制带下划线的自动换行段落
// ★★★ 想调整"下划线内文字前后的空白"，只改下面 FIELD_GAP 这个数字即可（单位：像素）★★★
// 效果：填写文字写在横线内部，文字前后各留 FIELD_GAP 空白；横线恰好覆盖"空白+文字+空白"，
//       不会压到前后固定文字的下面，横线与前面固定文字之间保持正常排版距离。
function drawSegmentsWrapped(ctx, segments, x, y, maxW, lineH, firstIndent) {
    const FIELD_GAP = 20; // 横线内、填写文字前后的空白宽度
    let cx = x + (firstIndent || 0);
    let cy = y;
    let ulStart = null; // 当前横线的起点（含文字前面的空白）
    ctx.textAlign = 'left';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    function closeUnderline() {
        if (ulStart === null) return;
        ctx.beginPath();
        ctx.moveTo(ulStart, cy + 10);
        ctx.lineTo(cx, cy + 10);
        ctx.stroke();
        ulStart = null;
    }
    for (const seg of segments) {
        if (seg.u) {
            // 文字前面的空白：文字右移，横线从留白起点开始（紧接前面的固定文字）
            cx += FIELD_GAP;
            ulStart = cx - FIELD_GAP;
        }
        for (const ch of seg.t) {
            const cw = ctx.measureText(ch).width;
            if (cx + cw > x + maxW && cx > x) {
                closeUnderline(); // 换行前先闭合当前横线
                cx = x;
                cy += lineH;
                if (seg.u) ulStart = x; // 换行后若仍在填写字段内（如身份证号），重新起一条横线
            }
            ctx.fillText(ch, cx, cy);
            cx += cw;
        }
        if (seg.u) {
            // 文字后面的空白：横线延伸覆盖这段留白，再闭合
            cx += FIELD_GAP;
            closeUnderline();
        }
    }
    return cy + lineH;
}

// 加载照片（没有照片时返回 null）
function loadPhoto(src) {
    return new Promise(resolve => {
        if (!src) return resolve(null);
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = () => resolve(null);
        im.src = src;
    });
}

// 绘制整页 A4 证明，返回 canvas
function drawProof(data, photo) {
    const W = 1240, H = 1754; // A4 纸张，约 150 DPI
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.textBaseline = 'alphabetic';

    const left = 160, right = W - 160, contentW = right - left;

    // 标题
    ctx.textAlign = 'center';
    ctx.font = 'bold 60px ' + FONT_TITLE;
    let titleY;
    if (data.isCet) {
        ctx.fillText('全国大学外语四六级考试', W / 2, 210);
        ctx.fillText('在校学生身份证明', W / 2, 290);
        titleY = 290;
    } else {
        ctx.fillText('在校学生身份证明', W / 2, 250);
        titleY = 250;
    }

    // 正文（带下划线填写项）
    ctx.font = '38px ' + FONT_BODY;
    const lineH = 76;
    let y = titleY + 170;
    const segments = [
        {t:'兹证明', u:false}, {t:data.name, u:true},
        {t:'，性别', u:false}, {t:data.sex, u:true},
        {t:'，民族', u:false}, {t:data.nation, u:true},
        {t:'，身份证号码', u:false}, {t:data.idcard, u:true},
        {t:'，出生于', u:false}, {t:data.birth, u:true},
        {t:'，学号', u:false}, {t:data.stuid, u:true},
        {t:'，系本学院', u:false}, {t:data.grade, u:true},
        {t:'级', u:false}, {t:data.major, u:true},
        {t:'专业在校学生。', u:false}
    ];
    y = drawSegmentsWrapped(ctx, segments, left, y, contentW, lineH, 76);

    // 情况属实 / 辅导员签字
    y += 30;
    ctx.fillText('情况属实。', left + 76, y);
    y += lineH;
    ctx.fillText('辅导员签字：', left + 76, y);

    // 照片框（右侧）
    const pw = 240, ph = 336;
    const px = right - pw, py = titleY + 420;
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 3;
    ctx.strokeRect(px, py, pw, ph);
    if (photo) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(px + 2, py + 2, pw - 4, ph - 4);
        ctx.clip();
        // 按短边裁切，保持照片不变形
        const scale = Math.max((pw - 4) / photo.width, (ph - 4) / photo.height);
        const dw = photo.width * scale, dh = photo.height * scale;
        ctx.drawImage(photo, px + (pw - dw) / 2, py + (ph - dh) / 2, dw, dh);
        ctx.restore();
    } else {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#bbb';
        ctx.font = '26px ' + FONT_BODY;
        ctx.fillText('照片', px + pw / 2, py + ph / 2);
        ctx.fillStyle = '#000';
        ctx.textAlign = 'left';
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = '#999';
    ctx.font = '22px ' + FONT_BODY;
    ctx.fillText('贴照片处（盖学院公章）', px + pw / 2, py + ph + 40);

    // 落款
    ctx.textAlign = 'right';
    ctx.fillStyle = '#000';
    ctx.font = '38px ' + FONT_BODY;
    ctx.fillText(data.dept, right, 1510);
    ctx.fillText(data.date, right, 1590);

    return canvas;
}

// 把字节数组拼成 PDF 文件（单个 JPEG 页面）
function buildPdf(jpegBytes, imgW, imgH) {
    const enc = new TextEncoder();
    const parts = [];
    let pos = 0;
    const offsets = [];
    function push(bytes) {
        parts.push(bytes);
        pos += bytes.length;
    }
    function pushStr(s) {
        push(enc.encode(s));
    }
    function addObj(num, body) {
        offsets[num] = pos;
        pushStr(num + ' 0 obj\n');
        if (typeof body === 'string') pushStr(body);
        else push(body);
        pushStr('\nendobj\n');
    }

    const pageW = 595.28, pageH = 841.89; // A4，单位 pt
    pushStr('%PDF-1.4\n');
    push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A])); // 二进制标记

    addObj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    addObj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    addObj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageW + ' ' + pageH +
             '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');

    // 图片对象：JPEG 直接以 DCTDecode 嵌入，无需重新编码
    const imgDict = '<< /Type /XObject /Subtype /Image /Width ' + imgW +
        ' /Height ' + imgH + ' /ColorSpace /DeviceRGB /BitsPerComponent 8' +
        ' /Filter /DCTDecode /Length ' + jpegBytes.length + ' >>\nstream\n';
    addObj(4, (function(){
        const head = enc.encode(imgDict);
        const tail = enc.encode('\nendstream');
        const all = new Uint8Array(head.length + jpegBytes.length + tail.length);
        all.set(head, 0);
        all.set(jpegBytes, head.length);
        all.set(tail, head.length + jpegBytes.length);
        return all;
    })());

    const content = 'q\n' + pageW + ' 0 0 ' + pageH + ' 0 0 cm\n/Im0 Do\nQ\n';
    addObj(5, '<< /Length ' + enc.encode(content).length + ' >>\nstream\n' + content + 'endstream');

    const xrefPos = pos;
    let xref = 'xref\n0 6\n0000000000 65535 f \n';
    for (let i = 1; i <= 5; i++) {
        xref += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    }
    xref += 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF';
    pushStr(xref);

    return new Blob(parts, {type: 'application/pdf'});
}

// dataURL 转字节数组
function dataUrlToBytes(dataUrl) {
    const bin = atob(dataUrl.split(',')[1]);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
}

let currentPdfUrl = '';

// 主流程：生成 PDF
document.getElementById('createBtn').onclick = async function() {
    const data = collectData();
    if (!data) return;

    const btn = this;
    btn.disabled = true;
    btn.textContent = '正在生成 PDF…';
    try {
        const photo = await loadPhoto(imgBase64);
        const canvas = drawProof(data, photo);
        const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.95);
        const blob = buildPdf(dataUrlToBytes(jpegDataUrl), canvas.width, canvas.height);

        if (currentPdfUrl) URL.revokeObjectURL(currentPdfUrl);
        currentPdfUrl = URL.createObjectURL(blob);

        const fileName = (data.isCet ? '四六级在校身份证明-' : '在校学生身份证明-') +
                         data.name.replace(/[\\/:*?"<>|]/g, '') + '.pdf';
        const downloadLink = document.getElementById('downloadLink');
        const openLink = document.getElementById('openLink');
        downloadLink.href = currentPdfUrl;
        downloadLink.download = fileName;
        openLink.href = currentPdfUrl;
        document.getElementById('pdfFileName').textContent = '文件名：' + fileName;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('resultBox').scrollIntoView({behavior:'smooth', block:'start'});
    } catch (err) {
        console.error(err);
        alert('PDF 生成失败，请重试或更换浏览器。');
    } finally {
        btn.disabled = false;
        btn.textContent = '生成 PDF 文件（手机 / 电脑通用）';
    }
};
</script>
